name: kigali_city_services
description: Kigali City Services and Places Directory Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3

  # Map (OpenStreetMap, no API key required)
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Open URL / navigation / phone calls
  url_launcher: ^6.3.2

  # State management
  flutter_riverpod: ^3.2.1

  # Utilities
  cupertino_icons: ^1.0.8
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true