name: kigali_city_services
description: Kigali City Services and Places Directory Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # Map (OpenStreetMap, no API key required)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Open URL / navigation / phone calls
  url_launcher: ^6.2.4

  # State management
  flutter_riverpod: ^2.4.9

  # Utilities
  cupertino_icons: ^1.0.6
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true